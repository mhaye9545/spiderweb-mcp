[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiderweb-mcp"
version = "0.1.0"
description = "Central FastMCP gateway bridging Claude Code with Google Workspace and GitHub"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "PyGithub>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
spiderweb-mcp = "spiderweb_mcp.server:main"
spiderweb-mcp-auth = "spiderweb_mcp.auth.init_oauth:run_auth_flow"

[tool.hatch.build.targets.wheel]
packages = ["src/spiderweb_mcp"]
